<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campuslit</title>
<link rel="stylesheet" href="studio.css">
<script src="icons.js" defer></script>
<script src="themes.js" defer></script>
<script src="storage.js" defer></script>
<script src="popup.js" defer></script>
</head>
<body class="popup">
  <header class="pop-head">
    <a class="pop-brand" href="options.html" target="_blank" rel="noopener"><img src="icons/icon-48.png" width="28" height="28" alt=""><span>Campuslit</span></a>
    <button id="customize" class="pop-link" type="button">All settings <span data-icon="arrow"></span></button>
  </header>

  <div class="pop-list" role="group" aria-label="Where Campuslit runs">
    <label class="pop-row"><span>Enable Campuslit</span><input id="enabled" type="checkbox" role="switch" checked><span class="track" aria-hidden="true"></span></label>
    <label class="pop-row sub"><span>CMS</span><input id="cms" type="checkbox" role="switch" checked><span class="track" aria-hidden="true"></span></label>
    <label class="pop-row sub"><span>LMS</span><input id="lms" type="checkbox" role="switch" checked><span class="track" aria-hidden="true"></span></label>
  </div>

  <h2 class="pop-label" id="p-theme">Theme</h2>
  <div id="themes" class="pop-themes" role="group" aria-labelledby="p-theme"></div>

  <div class="pop-list">
    <label class="pop-row"><span>Follow device appearance<small id="system-note">Midnight when your device is dark</small></span><input id="system" type="checkbox" role="switch"><span class="track" aria-hidden="true"></span></label>
  </div>

  <footer class="pop-foot"><span class="foot-status"><span class="local-dot"></span><span id="status" role="status" aria-live="polite">Stored only on this browser</span></span><a href="privacy.html" target="_blank" rel="noopener">Privacy</a></footer>
</body>
</html>
