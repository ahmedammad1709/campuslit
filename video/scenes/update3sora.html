<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campuslit update video composer (landscape)</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="update3.css">
<style>@font-face { font-family: "Jakarta"; src: url("/fonts/sora-latin.woff2") format("woff2"); font-weight: 200 800; }.cap{font-size:50px!important;letter-spacing:-.03em!important}#hk-big{font-size:186px!important;letter-spacing:-.03em!important}#hk-list div{font-size:34px!important}#en-num{font-size:290px!important}#en-sub{font-size:76px!important}#en-brand b{font-size:90px!important}#en-chips span{font-size:28px!important}#en-site{font-size:36px!important}#steps b{font-size:20px!important}#hk-kicker{font-size:26px!important}</style>
</head>
<body>
<div id="frame">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="glass"></div>
  <div id="steps"></div>
  <div id="win">
    <div class="bar"><i></i><i></i><i></i><span id="url">lms.bahria.edu.pk</span></div>
    <div id="view"></div>
  </div>
  <div id="label"></div>
  <div id="hook">
    <div id="hk-kicker">BAHRIA UNIVERSITY PORTAL</div>
    <div id="hk-big">NEW<br>UPDATE</div>
    <div id="hk-list"></div>
  </div>
  <div id="caps"></div>
  <div id="flash"></div>
  <div id="cursor"><svg viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.1 3 6.6 3-1.4-3-6.4h6.5z" fill="#fff" stroke="#0b1d40" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="ripple"></div>
  <div id="end">
    <div id="en-l">
      <div id="en-kicker">THANK YOU</div>
      <div id="en-num"><span id="en-n">0</span><sup>+</sup></div>
      <div id="en-sub">installs</div>
    </div>
    <div id="en-r">
      <div id="en-brand"><svg viewBox="0 0 128 128" width="110" height="110" aria-hidden="true"><rect width="128" height="128" rx="30" fill="#0b1d40" stroke="#27407a" stroke-width="3"/><path d="M80.57 81.21A30 30 0 1 1 80.57 46.79" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><circle cx="90" cy="64" r="8.5" fill="#f2b84b"/></svg><b>campus<span>lit</span></b></div>
      <div id="en-chips"><span>Free</span><span>Private</span><span>Update it now</span></div>
      <div id="en-site">campuslit-bu.vercel.app</div>
    </div>
    <div id="en-fine">Unofficial &middot; not affiliated with Bahria University</div>
    <div id="confetti"></div>
  </div>
  <div id="bar"><i></i></div>
</div>
<script>window.PLAIN = true;</script>
<script src="update3.js"></script>
</body>
</html>
