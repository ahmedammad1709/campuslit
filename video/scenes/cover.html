<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campuslit Instagram cover</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="cover.css">
</head>
<body>
<div id="frame">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="eyebrow">For Bahria University students</div>
  <h1><span>I fixed the</span><span class="gold">Bahria portal.</span></h1>
  <div class="win" id="winBefore">
    <div class="bar"><i></i><i></i><i></i><span>lms.bahria.edu.pk</span><em>Sample data</em></div>
    <div class="view" id="before"></div>
  </div>
  <div class="tag before">Before</div>
  <div id="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#2f5bea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
  <div class="win" id="winAfter">
    <div class="bar"><i></i><i></i><i></i><span>lms.bahria.edu.pk</span><em>Sample data</em></div>
    <div class="view" id="after"></div>
  </div>
  <div class="tag after">After</div>
  <p id="sub">Same logins. Same data. A whole new look.</p>
  <div id="lock">
    <svg viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="30" fill="#0b1d40" stroke="rgba(255,255,255,.25)" stroke-width="2"/><path d="M80.57 81.21A30 30 0 1 1 80.57 46.79" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><circle cx="98" cy="64" r="8.5" fill="#f2b84b"/></svg>
    <span>campus<b>lit</b></span>
  </div>
</div>
<script src="cover.js"></script>
</body>
</html>
