<!doctype html>
<html lang="en" class="land">
<head>
<meta charset="utf-8">
<title>Campuslit video composer: 4 problems, all fixed</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="glow.css">
</head>
<body>
<div id="frame">
  <div id="orbs"><i id="orbA"></i><i id="orbB"></i><i id="orbC"></i></div>
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="win">
    <div class="bar"><i></i><i></i><i></i><span id="url">lms.bahria.edu.pk</span><b id="tag"></b><em>Sample data</em></div>
    <div id="view"></div>
    <div id="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><div><b id="chipname">campuslit-timetable.ics</b><span id="chipsub">Downloading</span><i><u id="chipbar"></u></i></div></div>
    <div id="dock">
      <div id="dots"></div>
      <div id="slider"><label>Accent</label><div class="track"><b></b></div></div>
      <div id="tname">Bahria</div>
    </div>
    <div id="keys"><kbd>Ctrl</kbd><span>+</span><kbd>K</kbd></div>
    <div id="shine"></div>
  </div>
  <div id="scrim"></div>
  <div id="card"><div class="cn"><small id="cardkind">Problem</small><b id="cardnum">01</b><span id="carddots"><i></i><i></i><i></i><i></i></span></div></div>
  <div id="caps"></div>
  <div id="end">
    <svg id="mark" viewBox="0 0 128 128" width="300" height="300" aria-hidden="true"><rect width="128" height="128" rx="30" fill="#0b1d40"/><path id="ring" pathLength="1" d="M80.57 81.21A30 30 0 1 1 80.57 46.79" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><circle id="dot" cx="98" cy="64" r="8.5" fill="#f2b84b"/></svg>
    <div id="word">campus<span>lit</span></div>
    <div id="tag2">The Bahria University Portal, redesigned</div>
    <div id="chips"><span>Free</span><span>Private</span><span>Open source</span></div>
    <div id="site">campuslit-bu.vercel.app</div>
    <div id="fine">Unofficial &middot; not affiliated with Bahria University</div>
  </div>
  <div id="cursor"><svg viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.1 3 6.6 3-1.4-3-6.4h6.5z" fill="#fff" stroke="#0b1d40" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="ripple"></div>
  <div id="bar"><i></i></div>
</div>
<script src="/themes.js"></script>
<script src="glow.js"></script>
</body>
</html>
