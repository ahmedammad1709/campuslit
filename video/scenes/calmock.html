<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar (illustration for the Campuslit video)</title>
<style>
@font-face { font-family: "Jakarta"; src: url("/fonts/jakarta-latin.woff2") format("woff2"); font-weight: 200 800; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1440px; height: 1100px; overflow: hidden; background: #f6f8fd; font-family: "Jakarta", system-ui, sans-serif; color: #0e1a33; -webkit-font-smoothing: antialiased; }
header { height: 92px; display: flex; align-items: center; gap: 22px; padding: 0 44px; background: #fff; border-bottom: 1px solid #e1e7f3; }
header .logo { width: 44px; height: 44px; border-radius: 12px; background: #e9efff; display: grid; place-items: center; }
header .logo svg { width: 26px; height: 26px; color: #2f5bea; }
header h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
header .range { margin-left: 12px; font-size: 22px; font-weight: 600; color: #566683; }
header .pill { margin-left: auto; padding: 9px 22px; border-radius: 999px; background: #eef2fb; color: #3c4a68; font-weight: 700; font-size: 18px; }
#toast { position: absolute; right: 44px; top: 108px; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-radius: 16px; background: #0e1a33; color: #fff; font-size: 22px; font-weight: 700; box-shadow: 0 20px 50px rgba(8, 20, 50, .4); opacity: 0; transform: translateY(-14px); }
#toast i { width: 30px; height: 30px; border-radius: 50%; background: #1f9d63; display: grid; place-items: center; }
#toast svg { width: 18px; height: 18px; }
.grid { position: absolute; left: 44px; right: 44px; top: 100px; height: 690px; background: #fff; border: 1px solid #e1e7f3; border-radius: 18px; overflow: hidden; }
.days { position: absolute; left: 90px; right: 0; top: 0; height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid #e1e7f3; }
.days div { display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #33415f; border-left: 1px solid #eef2fb; }
.days div:first-child { border-left: 0; }
.body { position: absolute; left: 0; right: 0; top: 64px; bottom: 0; }
.hours { position: absolute; left: 0; top: 0; width: 90px; bottom: 0; }
.hours span { position: absolute; right: 14px; transform: translateY(-50%); font-size: 15px; font-weight: 700; color: #7a88a6; }
.lines { position: absolute; left: 90px; right: 0; top: 0; bottom: 0; }
.lines i { position: absolute; left: 0; right: 0; height: 1px; background: #eef2fb; }
.cols { position: absolute; left: 90px; right: 0; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
.cols div { position: relative; border-left: 1px solid #eef2fb; }
.cols div:first-child { border-left: 0; }
.ev { position: absolute; left: 8px; right: 8px; padding: 8px 12px; border-radius: 12px; overflow: hidden; border-left: 6px solid var(--c); background: var(--b); opacity: 0; transform: translateY(10px) scale(.94); }
.ev b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.01em; color: #0e1a33; line-height: 1.2; }
.ev span { display: block; margin-top: 2px; font-size: 14px; font-weight: 600; color: #4a5875; }
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></div>
  <h1>My calendar</h1><span class="range">This semester, every week</span><span class="pill">Week</span>
</header>
<div id="toast"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.2 4.2L19 7"/></svg></i><span id="toasttext">12 classes added</span></div>
<div class="grid">
  <div class="days"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div></div>
  <div class="body" id="body"><div class="hours" id="hours"></div><div class="lines" id="lines"></div><div class="cols" id="cols"></div></div>
</div>
<script>
(function () {
  const H0 = 8, H1 = 18, PX = 55;                      // 8 AM to 6 PM, 62 px an hour
  const hours = document.getElementById('hours'), lines = document.getElementById('lines'), cols = document.getElementById('cols');
  const label = h => (h % 12 || 12) + (h < 12 ? ' AM' : ' PM');
  for (let h = H0; h <= H1; h++) {
    const y = (h - H0) * PX + 14;
    const s = document.createElement('span'); s.style.top = y + 'px'; s.textContent = label(h); hours.append(s);
    const l = document.createElement('i'); l.style.top = y + 'px'; lines.append(l);
  }
  const days = [1, 2, 3, 4, 5].map(() => { const d = document.createElement('div'); cols.append(d); return d; });
  const PAL = [['#2f5bea', '#e9efff'], ['#1f9d63', '#e2f6ea'], ['#d99a1c', '#fff4dc'], ['#8a4fff', '#f0eaff'], ['#e5384b', '#ffe9ec'], ['#0e8aa8', '#e0f4f8']];
  let nodes = [];
  window.__setEvents = list => {
    nodes.forEach(n => n.remove()); nodes = [];
    const colour = new Map();
    list.slice().sort((a, b) => a.day - b.day || a.start - b.start).forEach(e => {
      if (!colour.has(e.title)) colour.set(e.title, PAL[colour.size % PAL.length]);
      const [c, b] = colour.get(e.title);
      const el = document.createElement('div'); el.className = 'ev'; el.style.setProperty('--c', c); el.style.setProperty('--b', b);
      el.style.top = ((e.start / 60 - H0) * PX + 14) + 'px'; el.style.height = Math.max(40, (e.end - e.start) / 60 * PX - 4) + 'px';
      const t = document.createElement('b'); t.textContent = e.title; const r = document.createElement('span'); r.textContent = e.room;
      el.append(t, r); days[e.day - 1].append(el); nodes.push(el);
    });
    document.getElementById('toasttext').textContent = list.length + ' classes added, repeating every week';
  };
  // p: 0..1, how much of the week has filled in; each class pops in turn
  window.__fill = p => {
    const n = nodes.length;
    nodes.forEach((el, i) => {
      const u = Math.max(0, Math.min(1, p * (n + 2) - i)), e = 1 - Math.pow(1 - u, 3);
      el.style.opacity = String(e); el.style.transform = `translateY(${(1 - e) * 10}px) scale(${.94 + .06 * e})`;
    });
    const k = Math.max(0, Math.min(1, (p - .96) / .04)), t = document.getElementById('toast');
    t.style.opacity = String(k); t.style.transform = `translateY(${(1 - k) * -14}px)`;
  };
  window.__ready = true;
})();
</script>
</body>
</html>
