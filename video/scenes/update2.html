<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campuslit update video composer</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="update.css">
</head>
<body>
<div id="frame">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="steps"></div>
  <div id="win">
    <div class="bar"><i></i><i></i><i></i><span id="url">lms.bahria.edu.pk</span></div>
    <div id="view"></div>
  </div>
  <div id="label"></div>
  <div id="hook">
    <div id="hk-kicker">BAHRIA UNIVERSITY PORTAL</div>
    <div id="hk-big">NEW<br>UPDATE</div>
    <div id="hk-list"></div>
  </div>
  <div id="caps"></div>
  <div id="flash"></div>
  <div id="cursor"><svg viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.1 3 6.6 3-1.4-3-6.4h6.5z" fill="#fff" stroke="#0b1d40" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="ripple"></div>
  <div id="end">
    <div id="en-kicker">THANK YOU</div>
    <div id="en-num"><span id="en-n">0</span><sup>+</sup></div>
    <div id="en-sub">installs</div>
    <div id="en-brand"><svg viewBox="0 0 128 128" width="120" height="120" aria-hidden="true"><rect width="128" height="128" rx="30" fill="#0b1d40" stroke="#27407a" stroke-width="3"/><path d="M80.57 81.21A30 30 0 1 1 80.57 46.79" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><circle cx="90" cy="64" r="8.5" fill="#f2b84b"/></svg><b>campus<span>lit</span></b></div>
    <div id="en-chips"><span>Update it now</span><span>Free</span></div>
    <div id="en-site">Link in bio</div>
    <div id="en-fine">Unofficial &middot; not affiliated with Bahria University</div>
    <div id="confetti"></div>
  </div>
</div>
<script src="update2.js"></script>
</body>
</html>
