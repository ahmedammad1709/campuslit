<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campuslit promo tile</title>
<meta name="viewport" content="width=440">
<style>
  @font-face { font-family: "Jakarta"; src: url("/fonts/jakarta-latin.woff2") format("woff2"); font-weight: 200 800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #0b1d40; }
  body { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 36px; font-family: "Jakarta", system-ui, sans-serif; color: #fff;
         background: radial-gradient(120% 90% at 100% 0%, #1f4fa8 0%, rgba(31, 79, 168, 0) 60%), radial-gradient(90% 80% at 0% 100%, #14316f 0%, rgba(20, 49, 111, 0) 70%), #0b1d40; }
  .logo { width: 68px; height: 68px; margin-bottom: 20px; border-radius: 16px; box-shadow: 0 10px 28px -8px rgba(0, 0, 0, .55); }
  h1 { margin: 0; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em; }
  p { margin: 10px 0 0; max-width: 330px; font-size: 17px; line-height: 1.4; font-weight: 500; color: #c9d6f2; }
  small { position: absolute; left: 36px; bottom: 22px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8ea2cf; }
  .dot { position: absolute; right: 36px; top: 36px; width: 14px; height: 14px; border-radius: 50%; background: #f2b84b; }
</style>
</head>
<body>
  <img class="logo" src="/brand/logo.svg" alt="">
  <h1>Campuslit</h1>
  <p>A calmer CMS and LMS for Bahria students.</p>
  <small>Unofficial &middot; private by design</small>
  <span class="dot"></span>
</body>
</html>
